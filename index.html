<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stille Helden">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f7f4ff">
<title>Stille Heldinnen und Helden 6c</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: Kopfleiste mit Reitern, darunter eine grosse Bühne fürs iPad im Querformat; Rad links, Ergebnis rechts, bei schmaler Breite untereinander. */
:root {
  --bg: #14123a;
  --surface: #1f1c56;
  --surface2: #2b2874;
  --line: #3b3891;
  --fg: #f5f3ff;
  --muted: #b0acea;
  --gold: #ffc53d;
  --pink: #ff4d8d;
  --cyan: #2dd4e6;
  --lime: #8be04e;
  --violet: #8b5cf6;
  --orange: #ff8a3d;
  --ink: #14123a;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 40px;
  min-height: 100vh;
  background-image: radial-gradient(900px 500px at 85% -10%, rgba(139,92,246,.35), transparent 60%), radial-gradient(700px 400px at -5% 110%, rgba(45,212,230,.18), transparent 60%);
  background-attachment: fixed;
}
.wrap { max-width: 1180px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; line-height: 1.1; }
h1 { font-size: clamp(26px, 4vw, 40px); font-weight: 800; letter-spacing: -.01em; }
h2 { font-size: clamp(24px, 3.4vw, 34px); font-weight: 800; }
h3 { font-size: 20px; font-weight: 700; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

header.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; padding-bottom: 14px; }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand small { color: var(--muted); font-size: 21px; }
nav.tabs { display: flex; gap: 6px; flex-wrap: wrap; background: var(--surface); padding: 6px; border-radius: 16px; }
nav.tabs button { border: 0; background: transparent; padding: 10px 16px; border-radius: 11px; font-weight: 700; color: var(--muted); min-height: 44px; }
nav.tabs button[aria-selected="true"] { background: var(--gold); color: var(--ink); }
nav.tabs button:not([aria-selected="true"]):hover { background: var(--surface2); color: var(--fg); }

.notice { background: var(--surface2); border: 1px dashed var(--gold); border-radius: 12px; padding: 10px 14px; margin-bottom: 16px; color: var(--fg); font-size: 15px; }

.btn { border: 0; border-radius: 14px; padding: 14px 22px; font-weight: 800; font-size: 18px; min-height: 52px; background: var(--surface2); color: var(--fg); transition: transform .12s ease, filter .12s ease; }
.btn:hover { filter: brightness(1.15); }
.btn:active { transform: scale(.97); }
.btn.gold { background: var(--gold); color: var(--ink); }
.btn.pink { background: var(--pink); color: #fff; }
.btn.lime { background: var(--lime); color: var(--ink); }
.btn.ghost { background: transparent; border: 2px solid var(--line); }
.btn.small { padding: 8px 14px; font-size: 15px; min-height: 40px; border-radius: 10px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.link { background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 8px; font-size: 15px; }

/* Heute */
.stage { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 28px; align-items: center; }
@media (max-width: 860px) { .stage { grid-template-columns: minmax(0, 1fr); } }
.wheel-box { position: relative; width: 100%; max-width: 560px; aspect-ratio: 1; margin: 0 auto; }
.wheel-box canvas { width: 100%; height: 100%; display: block; }
.pointer { position: absolute; left: 50%; top: -6px; transform: translateX(-50%); width: 0; height: 0; border-left: 20px solid transparent; border-right: 20px solid transparent; border-top: 38px solid var(--gold); filter: drop-shadow(0 4px 0 rgba(0,0,0,.35)); z-index: 2; }
.hub { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 22%; aspect-ratio: 1; border-radius: 50%; background: var(--bg); border: 6px solid var(--gold); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: clamp(14px, 2.2vw, 22px); text-align: center; line-height: 1; z-index: 2; }
.side { display: flex; flex-direction: column; gap: 18px; align-items: flex-start; min-width: 0; }
.eyebrow { text-transform: uppercase; letter-spacing: .14em; font-size: 13px; font-weight: 700; color: var(--cyan); }
.lead { color: var(--muted); font-size: 19px; max-width: 34ch; margin: 0; }
.goalcard { width: 100%; border-radius: 22px; padding: 26px 28px; color: var(--ink); background: var(--gold); box-shadow: 0 8px 0 rgba(0,0,0,.28); }
.goalcard .eyebrow { color: rgba(20,18,58,.7); }
.goalcard .goal { font-family: var(--font-display); font-weight: 800; font-size: clamp(28px, 4.4vw, 48px); line-height: 1.05; margin-top: 6px; overflow-wrap: anywhere; }
.mystery { display: flex; gap: 12px; flex-wrap: wrap; }
.mcard { width: 96px; height: 100px; border-radius: 16px; background: var(--surface2); border: 2px dashed var(--line); display: grid; place-items: center; font-family: var(--font-display); font-size: 44px; font-weight: 800; color: var(--violet); animation: bob 2.4s ease-in-out infinite; }
.mcard:nth-child(2) { animation-delay: .3s; } .mcard:nth-child(3) { animation-delay: .6s; } .mcard:nth-child(4) { animation-delay: .9s; } .mcard:nth-child(5) { animation-delay: 1.2s; }
@keyframes bob { 50% { transform: translateY(-6px); } }
.row { display: flex; gap: 12px; flex-wrap: wrap; }
.mcard[data-peek] { cursor: pointer; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }
.mcard.peek { font-size: 19px; color: var(--gold); border: 2px solid var(--gold); text-align: center; overflow-wrap: anywhere; line-height: 1.1; padding: 4px; animation: none; }
.mwrap { display: grid; gap: 8px; justify-items: center; }
.rbtns { display: flex; gap: 6px; }
.rb { border: 2px solid var(--line); background: transparent; border-radius: 10px; padding: 8px 14px; font-weight: 800; min-height: 44px; }
.rb.yes[aria-pressed="true"] { background: var(--lime); border-color: var(--lime); color: var(--ink); }
.rb.no[aria-pressed="true"] { background: var(--pink); border-color: var(--pink); color: #fff; }

.heroes { display: flex; flex-wrap: wrap; gap: 14px; width: 100%; }
.hero { flex: 1 1 150px; max-width: 220px; background: var(--surface); border-radius: 20px; padding: 14px; text-align: center; border: 2px solid var(--gold); animation: pop .5s cubic-bezier(.3,1.6,.5,1) both; }
.hero:nth-child(2) { animation-delay: .35s; } .hero:nth-child(3) { animation-delay: .7s; } .hero:nth-child(4) { animation-delay: 1.05s; } .hero:nth-child(5) { animation-delay: 1.4s; }
@keyframes pop { from { transform: scale(.3) rotate(-8deg); opacity: 0; } to { transform: none; opacity: 1; } }
.hero .name { font-family: var(--font-display); font-weight: 800; font-size: 22px; margin-top: 6px; overflow-wrap: anywhere; }
.hero .plus { color: var(--gold); font-weight: 700; }

/* Avatare, Galerie */
.av { display: block; border-radius: 18px; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
.gcard { background: var(--surface); border-radius: 18px; padding: 12px; text-align: center; min-width: 0; }
.gcard .name { font-weight: 800; font-family: var(--font-display); font-size: 19px; overflow-wrap: anywhere; margin-top: 8px; }
.gcard .meta { color: var(--muted); font-size: 14px; }
.stars { color: var(--gold); font-weight: 700; font-variant-numeric: tabular-nums; }

/* Shop */
.panel { background: var(--surface); border-radius: 22px; padding: 20px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 2px solid var(--line); background: transparent; border-radius: 999px; padding: 8px 14px; font-weight: 700; min-height: 44px; }
.chip[aria-pressed="true"] { background: var(--cyan); border-color: var(--cyan); color: var(--ink); }
.chip .stars { margin-left: 6px; }
.chip[aria-pressed="true"] .stars { color: var(--ink); }
.shop { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 22px; margin-top: 18px; }
@media (max-width: 760px) { .shop { grid-template-columns: minmax(0, 1fr); } }
.preview { text-align: center; }
.balance { font-family: var(--font-display); font-size: 34px; font-weight: 800; color: var(--gold); font-variant-numeric: tabular-nums; }
.slot { margin-bottom: 18px; }
.slot h3 { color: var(--muted); font-size: 14px; text-transform: uppercase; letter-spacing: .12em; margin-bottom: 8px; }
.items { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
.item { background: var(--surface2); border: 2px solid transparent; border-radius: 16px; padding: 8px; text-align: center; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.item:hover:not([disabled]) { border-color: var(--line); }
.item[data-on="1"] { border-color: var(--lime); }
.item .nm { font-weight: 700; font-size: 15px; }
.item .st { font-size: 13px; font-weight: 700; }
.item .st.buy { color: var(--gold); } .item .st.own { color: var(--muted); } .item .st.on { color: var(--lime); }
.item[disabled] { opacity: .5; cursor: not-allowed; }

/* Formulare */
label { display: block; font-weight: 700; margin-bottom: 6px; }
input[type=text], input[type=number], textarea { width: 100%; background: var(--bg); color: var(--fg); border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; font: inherit; min-height: 46px; }
textarea { min-height: 160px; resize: vertical; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
.goalrow { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.goalrow input[type=checkbox] { width: 24px; height: 24px; accent-color: var(--lime); flex: none; }
.goalrow input[type=text] { flex: 1; min-width: 0; }
.hint { color: var(--muted); font-size: 14px; margin: 6px 0 0; }
.log { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 6px; color: var(--muted); font-size: 15px; }
.stack { display: grid; gap: 16px; }

#toast { position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(30px); background: var(--fg); color: var(--ink); font-weight: 800; padding: 12px 20px; border-radius: 14px; opacity: 0; pointer-events: none; transition: .25s; z-index: 50; max-width: calc(100vw - 32px); text-align: center; }
#toast.show { opacity: 1; transform: translateX(-50%); }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 40; }
@media (prefers-reduced-motion: reduce) { .mcard, .hero { animation: none; } }

/* ---- Pastell-Look ---- */
:root {
  --bg: #f7f4ff; --surface: #ffffff; --surface2: #efe9ff; --line: #d9d0f5;
  --fg: #2c2a5a; --muted: #6b68a0; --gold: #ffd36b; --pink: #ff9fbd; --cyan: #8fd9e6;
  --lime: #a8e6a1; --violet: #b49cff; --orange: #ffb98a; --ink: #2c2a5a; --goldtext: #a36500;
  color-scheme: light;
}
body { background-image: radial-gradient(900px 500px at 85% -10%, rgba(180,156,255,.35), transparent 60%), radial-gradient(700px 400px at -5% 110%, rgba(143,217,230,.35), transparent 60%); }
:focus-visible { outline-color: #e2a600; }
.btn:hover { filter: brightness(.97); }
.btn.pink, .rb.no[aria-pressed="true"] { color: var(--ink); }
.panel, .gcard, .hero { box-shadow: 0 3px 0 var(--line); }
.pointer { filter: drop-shadow(0 3px 0 rgba(44,42,90,.25)); }
.hub { background: #fff; }
.goalcard { box-shadow: 0 6px 0 rgba(44,42,90,.12); }
.goalcard .eyebrow { color: rgba(44,42,90,.65); }
.eyebrow { color: #2a7f94; }
.stars, .balance, .hero .plus, .item .st.buy, .mcard.peek { color: var(--goldtext); }
.chip[aria-pressed="true"] .stars { color: var(--ink); }
.item .st.on { color: #2d8a3e; }
.mcard { background: #f0eaff; color: #8f78e8; }
.mcard.peek { background: #fff; }
.notice { background: #fff7e0; border-color: #f0c35a; }
input[type=text], input[type=number], textarea { background: #fff; }
#toast { background: var(--fg); color: #fff; }
</style>
<style>[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand"><h1>Stille Heldinnen und Helden der Klasse 6c</h1><small id="tagline">Wer ist heute dran? Das weiß nur das Rad.</small></div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Bereiche"></nav>
  </header>
  <main id="main"></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<canvas id="confetti"></canvas>

<script>
(function () {
  'use strict';

  /* ---------- Katalog ---------- */
  var STAGES = [
    { min: 0, name: 'Ei' }, { min: 1, name: 'Küken' }, { min: 3, name: 'Starter' },
    { min: 6, name: 'Profi' }, { min: 10, name: 'Legende' }
  ];
  var SLOTS = [
    { id: 'color', name: 'Farbe' }, { id: 'hat', name: 'Kopfschmuck' }, { id: 'glasses', name: 'Brillen' },
    { id: 'pet', name: 'Begleiter' }, { id: 'bg', name: 'Hintergrund' }
  ];
  var ITEMS = [
    { id: 'c_mint', slot: 'color', name: 'Mint', price: 1, val: '#4fe3b0' },
    { id: 'c_pink', slot: 'color', name: 'Pink', price: 1, val: '#ff7fb3' },
    { id: 'c_orange', slot: 'color', name: 'Orange', price: 1, val: '#ff9d4d' },
    { id: 'c_lila', slot: 'color', name: 'Lila', price: 2, val: '#a58bff' },
    { id: 'c_gold', slot: 'color', name: 'Gold', price: 3, val: '#ffd34d' },
    { id: 'h_cap', slot: 'hat', name: 'Cap', price: 1 },
    { id: 'h_party', slot: 'hat', name: 'Partyhut', price: 1 },
    { id: 'h_phones', slot: 'hat', name: 'Kopfhörer', price: 2 },
    { id: 'h_top', slot: 'hat', name: 'Zylinder', price: 2 },
    { id: 'h_crown', slot: 'hat', name: 'Krone', price: 3 },
    { id: 'g_round', slot: 'glasses', name: 'Rundbrille', price: 1 },
    { id: 'g_sun', slot: 'glasses', name: 'Sonnenbrille', price: 1 },
    { id: 'g_star', slot: 'glasses', name: 'Sternbrille', price: 2 },
    { id: 'p_bug', slot: 'pet', name: 'Käfer', price: 1, val: '🐞' },
    { id: 'p_chick', slot: 'pet', name: 'Küken', price: 2, val: '🐥' },
    { id: 'p_cat', slot: 'pet', name: 'Katze', price: 2, val: '🐱' },
    { id: 'p_dragon', slot: 'pet', name: 'Drache', price: 3, val: '🐉' },
    { id: 'b_meadow', slot: 'bg', name: 'Wiese', price: 1, val: ['#7fe05a', '#d9f7a8'] },
    { id: 'b_night', slot: 'bg', name: 'Nacht', price: 1, val: ['#1b1464', '#4a35b8'], stars: true },
    { id: 'b_beach', slot: 'bg', name: 'Strand', price: 2, val: ['#5fd0f5', '#f6e2a3'] },
    { id: 'b_space', slot: 'bg', name: 'Weltall', price: 3, val: ['#050316', '#3a1d7a'], stars: true }
  ];
  var ITEM = {}; ITEMS.forEach(function (i) { ITEM[i.id] = i; });
  var SEG_COLORS = ['#ffc2d4', '#b5e8f0', '#ffe9a3', '#c9f0b2', '#d9ccff', '#ffd2ad'];

  var DEFAULT_GOALS = [
    'stört den Unterricht nicht', 'meldet sich oft', 'hat alle Materialien parat',
    'hilft jemandem freundlich', 'hört zu, wenn andere sprechen', 'fängt sofort mit der Arbeit an',
    'ist pünktlich', 'lässt andere ausreden'
  ];
  var SAMPLE_NAMES = ['Alisa', 'Ben', 'Christina', 'Eris', 'Giulia', 'Kati', 'Kian', 'Leandro', 'Leen', 'Lorena', 'Lorina', 'Makar', 'Milana', 'Mischa', 'Olga', 'Omar', 'Petro', 'Philipp', 'Sebi', 'Vivi'];

  /* ---------- Zustand ---------- */
  var KEY = 'stille-helden-6c-v1';
  var S;
  function uid() { return Math.random().toString(36).slice(2, 9); }
  function newStudent(name) { return { id: uid(), name: name, earned: 0, spent: 0, owned: [], eq: {} }; }
  function freshState() {
    return {
      students: SAMPLE_NAMES.map(newStudent),
      goals: DEFAULT_GOALS.map(function (t) { return { id: uid(), text: t, on: true }; }),
      heroCount: 3, cycle: [], today: null, log: [], sample: false
    };
  }
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var o = JSON.parse(raw);
        if (o && o.students && o.goals) {
          if (o.sample) { o.students = SAMPLE_NAMES.map(newStudent); o.sample = false; o.cycle = []; o.today = null; }
          if (!o.students.length) { o.students = SAMPLE_NAMES.map(newStudent); o.cycle = []; }
          return o;
        }
      }
    } catch (e) {}
    return freshState();
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
  S = load();

  var tab = 'heute';
  var shopSel = null, bonusSel = null;
  var wheelRot = 0, spinning = false;
  var confirmReset = false;

  /* ---------- Helfer ---------- */
  function $(sel, root) { return (root || document).querySelector(sel); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function byId(id) { return S.students.filter(function (s) { return s.id === id; })[0]; }
  function bal(s) { return s.earned - s.spent; }
  function stageOf(s) { var k = 0; STAGES.forEach(function (st, i) { if (s.earned >= st.min) k = i; }); return k; }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  var toastTimer;
  function toast(msg) { var t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2600); }
  function logAdd(o) { o.t = Date.now(); S.log.unshift(o); S.log = S.log.slice(0, 60); }
  function dateStr(t) { return new Date(t).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' }); }

  /* ---------- Avatar (SVG) ---------- */
  function hatSvg(id) {
    switch (id) {
      case 'h_cap': return '<path d="M-22 4 Q0 -26 22 4 Z" fill="#3b82f6"/><rect x="-4" y="2" width="34" height="6" rx="3" fill="#1d4ed8"/>';
      case 'h_party': return '<polygon points="0,-34 -16,4 16,4" fill="#ff4d8d"/><circle cx="-4" cy="-8" r="3" fill="#ffc53d"/><circle cx="5" cy="-16" r="3" fill="#2dd4e6"/><circle cx="0" cy="-34" r="4" fill="#ffc53d"/>';
      case 'h_top': return '<rect x="-14" y="-30" width="28" height="32" rx="3" fill="#1b1b2e"/><rect x="-26" y="-2" width="52" height="7" rx="3" fill="#1b1b2e"/><rect x="-14" y="-10" width="28" height="6" fill="#ff4d8d"/>';
      case 'h_crown': return '<polygon points="-22,4 -22,-20 -11,-8 0,-26 11,-8 22,-20 22,4" fill="#ffc53d" stroke="#e59d00" stroke-width="2"/><circle cx="0" cy="-12" r="3" fill="#ff4d8d"/>';
      case 'h_phones': return '<path d="M-30 14 Q-30 -26 0 -26 Q30 -26 30 14" fill="none" stroke="#1b1b2e" stroke-width="6" stroke-linecap="round"/><rect x="-38" y="6" width="14" height="22" rx="6" fill="#ff4d8d"/><rect x="24" y="6" width="14" height="22" rx="6" fill="#ff4d8d"/>';
    }
    return '';
  }
  function glassesSvg(id) {
    switch (id) {
      case 'g_round': return '<g fill="none" stroke="#1b1b2e" stroke-width="3"><circle cx="-12" cy="0" r="9"/><circle cx="12" cy="0" r="9"/><path d="M-3 0 H3"/></g>';
      case 'g_sun': return '<g fill="#1b1b2e"><rect x="-23" y="-7" width="20" height="14" rx="6"/><rect x="3" y="-7" width="20" height="14" rx="6"/><rect x="-4" y="-3" width="8" height="3"/></g><path d="M-20 -3 l6 0" stroke="#fff" stroke-opacity=".5" stroke-width="2"/>';
      case 'g_star': return '<text x="-12" y="8" font-size="22" text-anchor="middle" fill="#ffc53d" stroke="#e59d00" stroke-width="1">★</text><text x="12" y="8" font-size="22" text-anchor="middle" fill="#ffc53d" stroke="#e59d00" stroke-width="1">★</text>';
    }
    return '';
  }
  function avatar(s, size, only) {

  addEventListener('resize', sizeConf); sizeConf();

  }

  /* ---------- Glücksrad ---------- */
  function activeGoals() { return S.goals.filter(function (g) { return g.on && g.text.trim(); }); }
  function wrapText(c, text, maxW) {
    var words = text.split(' '), lines = [], line = '';
    words.forEach(function (w) { var t = line ? line + ' ' + w : w; if (!line || c.measureText(t).width <= maxW) line = t; else { lines.push(line); line = w; } });
    if (line) lines.push(line); return lines;

  function drawWheel() {

    var w = cv.clientWidth || 520; cv.width = w * dpr; cv.height = w * dpr;
    var c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
    var R = w / 2 - 8, cx = w / 2, cy = w / 2;
    c.clearRect(0, 0, w, w);

    if (!n) { c.fillStyle = '#efe9ff'; c.beginPath(); c.arc(cx, cy, R, 0, 7); c.fill(); return; }
    var a = Math.PI * 2 / n, rOut = R - 14, rIn = R * 0.27, maxW = rOut - rIn;

      var t = goals[i].text.trim(), rMid = (rOut + rIn) / 2, avail = 2 * rMid * Math.sin(a / 2) * 0.86, fs, lines;
      for (fs = 26; fs >= 12; fs--) {
        c.font = '800 ' + fs + 'px "Bricolage Grotesque", system-ui, sans-serif'; lines = wrapText(c, t, maxW);
        var widest = Math.max.apply(null, lines.map(function (l) { return c.measureText(l).width; }));

  function pickHeroes() {
    var all = S.students.map(function (s) { return s.id; });

    var pool = all.filter(function (id) { return cycle.indexOf(id) < 0; });
    var n = Math.min(S.heroCount, all.length), picked = shuffle(pool).slice(0, n);
    if (picked.length < n) {
      S.cycle = [];
      var rest = shuffle(all.filter(function (id) { return picked.indexOf(id) < 0; }));

  }
  function spin() {
    var goals = activeGoals();
    if (spinning) return;
    if (!goals.length) { toast('Aktiviere zuerst mindestens ein Ziel in den Einstellungen.'); return; }
    if (!S.students.length) { toast('Trage zuerst Namen in den Einstellungen ein.'); return; }
    spinning = true;
    var btn = $('#spinBtn'); if (btn) btn.disabled = true;
    var n = goals.length, a = Math.PI * 2 / n, idx = Math.floor(Math.random() * n), TAU = Math.PI * 2;
    var jitter = (Math.random() - .5) * a * 0.7;

      S.today = { goalId: goals[idx].id, goalText: goals[idx].text, color: SEG_COLORS[idx % SEG_COLORS.length], heroes: pickHeroes(), status: 'open' };
      save(); confetti(60); setTimeout(render, 500);
    })(t0);
  }
  function resolve() {
    var t = S.today; if (!t || t.status !== 'open') return;
    t.res = t.res || {};
    var open = t.heroes.filter(function (id) { return t.res[id] === undefined; });
    if (open.length) { toast('Bitte bei jedem stillen Helden Ja oder Nein wählen.'); return; }
    var won = t.heroes.filter(function (id) { return t.res[id] === true; });
    won.forEach(function (id) { var s = byId(id); if (s) { s.earned += 1; if (S.cycle.indexOf(id) < 0) S.cycle.push(id); } });
    t.won = won; t.status = 'done';
    logAdd({ type: 'ziel', text: t.goalText, names: won.map(function (id) { return (byId(id) || {}).name; }).filter(Boolean) });
    save(); render(); if (won.length) confetti(220);
  }
  function setRes(id, val) { var t = S.today; if (!t || t.status !== 'open') return; t.res = t.res || {}; if (t.res[id] === val) delete t.res[id]; else t.res[id] = val; save(); render(); }

  }
  addEventListener('resize', function () { if (tab === 'heute') drawWheel(); });

  document.addEventListener('click', function (e) {
    var el = e.target.closest('button'); if (!el) return;
    var d = el.dataset;
    if (d.tab) { tab = d.tab; confirmReset = false; render(); return; }
    if (el.id === 'spinBtn') return spin();
    if (d.res) { var rp = d.res.split(':'); return setRes(rp[0], rp[1] === '1'); }
    if (el.id === 'finish') return resolve();
    if (el.id === 'allYes' || el.id === 'allNo') { var tt = S.today; if (!tt) return; tt.res = {}; tt.heroes.forEach(function (id) { tt.res[id] = el.id === 'allYes'; }); save(); return render(); }
    if (el.id === 'discard') { S.today = null; save(); return render(); }
    if (el.id === 'again') { S.today = null; save(); return render(); }
    if (el.id === 'toShop') { shopSel = S.today && (S.today.won || S.today.heroes)[0]; tab = 'shop'; return render(); }
    if (d.shop) { shopSel = d.shop; return render(); }
    if (d.bonus) { var keep = ($('#bonusNote') || {}).value; bonusSel = d.bonus; render(); if (keep) $('#bonusNote').value = keep; return; }
    if (d.buy) {
      var s = byId(shopSel), it = ITEM[d.buy]; if (!s || !it || bal(s) < it.price || s.owned.indexOf(it.id) >= 0) return;
      s.spent += it.price; s.owned.push(it.id); s.eq = s.eq || {}; s.eq[it.slot] = it.id; save(); render(); toast(s.name + ' hat ' + it.name + ' gekauft'); confetti(50); return;
    }
    if (d.equip !== undefined) {
      var s2 = byId(shopSel); if (!s2) return; var pr = d.equip.split(':'); s2.eq = s2.eq || {};
      if (pr[1]) s2.eq[pr[0]] = pr[1]; else delete s2.eq[pr[0]]; save(); return render();
    }
    if (el.id === 'giveBonus') {
      var b = byId(bonusSel); if (!b) { toast('Wähle zuerst ein Kind aus.'); return; }
      b.earned += 1; logAdd({ type: 'bonus', name: b.name, note: (($('#bonusNote') || {}).value || '').trim() }); save(); render(); toast('Stern für ' + b.name); confetti(90); return;
    }
    if (el.id === 'giveAll') {
      if (!S.students.length) return;
      S.students.forEach(function (s) { s.earned += 1; });
      logAdd({ type: 'bonus', name: 'Ganze Klasse', note: (($('#bonusNote') || {}).value || '').trim() }); save(); render(); toast('Ein Stern für die ganze Klasse'); confetti(260); return;
    }
    if (el.id === 'saveNames') {
      var seen = {}, names = $('#names').value.split('\n').map(function (x) { return x.trim(); }).filter(function (x) { if (!x || seen[x.toLowerCase()]) return false; seen[x.toLowerCase()] = 1; return true; });
      var old = {}; S.students.forEach(function (s) { old[s.name.toLowerCase()] = s; });
      S.students = names.map(function (nm) { return old[nm.toLowerCase()] || newStudent(nm); });
      S.sample = false; S.cycle = []; if (S.today && S.today.status === 'open') S.today.heroes = S.today.heroes.filter(function (id) { return byId(id); });
      save(); render(); toast(names.length + ' Namen gespeichert'); return;
    }
    if (el.id === 'addGoal') { var v = $('#newGoal').value.trim(); if (!v) return; S.goals.push({ id: uid(), text: v, on: true }); save(); return render(); }
    if (d.gdel) { S.goals = S.goals.filter(function (g) { return g.id !== d.gdel; }); save(); return render(); }
    if (el.id === 'copyBackup') {
      var txt = JSON.stringify(S);
      var fallback = function () { var ta = $('#restore'); ta.value = txt; ta.select(); toast('Text markiert, jetzt kopieren'); };
      try { navigator.clipboard.writeText(txt).then(function () { toast('Sicherung kopiert'); }, fallback); } catch (err) { fallback(); }
      return;
    }
    if (el.id === 'doRestore') {
      try { var o = JSON.parse($('#restore').value); if (!o.students || !o.goals) throw 0; S = o; save(); render(); toast('Sicherung eingespielt'); } catch (err) { toast('Das ist keine gültige Sicherung.'); }
      return;
    }
    if (el.id === 'reset') { if (!confirmReset) { confirmReset = true; return render(); } confirmReset = false; S = freshState(); save(); render(); toast('Alles zurückgesetzt'); return; }
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.dataset.gon) { S.goals.forEach(function (g) { if (g.id === t.dataset.gon) g.on = t.checked; }); save(); }
    else if (t.dataset.gtext) { S.goals.forEach(function (g) { if (g.id === t.dataset.gtext) g.text = t.value; }); save(); }
    else if (t.id === 'heroCount') { var n = Math.max(1, Math.min(5, parseInt(t.value, 10) || 3)); S.heroCount = n; t.value = n; save(); }
  });

  function peekOn(e) { var c = e.target.closest && e.target.closest('[data-peek]'); if (!c) return; var s = byId(c.dataset.peek); if (!s) return; c.classList.add('peek'); c.textContent = s.name; }
  function peekOff() { document.querySelectorAll('.mcard.peek').forEach(function (c) { c.classList.remove('peek'); c.textContent = '?'; }); }
  document.addEventListener('pointerdown', peekOn);
  ['pointerup', 'pointercancel'].forEach(function (ev) { document.addEventListener(ev, peekOff); });
  addEventListener('blur', peekOff);
  document.addEventListener('contextmenu', function (e) { if (e.target.closest && e.target.closest('[data-peek]')) e.preventDefault(); });

  render();
})();
</script>
</body>
</html>
